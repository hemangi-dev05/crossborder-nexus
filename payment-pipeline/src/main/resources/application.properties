
# ==========================================
# CROSS-BORDER CONTROL TOWER
# PostgreSQL Database Configuration
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/payment_control_tower
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVER
# ==========================================

server.port=8080

# ==========================================
# AML CONFIGURATION
# ==========================================

aml.blocked-names=Satoshi Nakamoto,Blacklisted Corp,Sanctioned Entity LLC

# ==========================================
# PAYMENT ROUTING CONFIGURATION
# ==========================================

# Corridor 1: India -> India
payment-routing.corridors[0].debtor-country-code=IN
payment-routing.corridors[0].creditor-country-code=IN
payment-routing.corridors[0].settlement-currency=INR
payment-routing.corridors[0].route-type=DOMESTIC_CLEARING
payment-routing.corridors[0].enabled=true

# Corridor 2: India -> USA
payment-routing.corridors[1].debtor-country-code=IN
payment-routing.corridors[1].creditor-country-code=US
payment-routing.corridors[1].settlement-currency=USD
payment-routing.corridors[1].route-type=CROSS_BORDER_CORRESPONDENT
payment-routing.corridors[1].enabled=true

# Corridor 3: India -> UK
payment-routing.corridors[2].debtor-country-code=IN
payment-routing.corridors[2].creditor-country-code=GB
payment-routing.corridors[2].settlement-currency=GBP
payment-routing.corridors[2].route-type=CROSS_BORDER_CORRESPONDENT
payment-routing.corridors[2].enabled=true

# Corridor 4: India -> Singapore
payment-routing.corridors[3].debtor-country-code=IN
payment-routing.corridors[3].creditor-country-code=SG
payment-routing.corridors[3].settlement-currency=SGD
payment-routing.corridors[3].route-type=CROSS_BORDER_CORRESPONDENT
payment-routing.corridors[3].enabled=true

# Corridor 5: USA -> UK
payment-routing.corridors[4].debtor-country-code=US
payment-routing.corridors[4].creditor-country-code=GB
payment-routing.corridors[4].settlement-currency=GBP
payment-routing.corridors[4].route-type=CROSS_BORDER_CORRESPONDENT
payment-routing.corridors[4].enabled=true

# Corridor 6: Germany -> USA
payment-routing.corridors[5].debtor-country-code=DE
payment-routing.corridors[5].creditor-country-code=US
payment-routing.corridors[5].settlement-currency=USD
payment-routing.corridors[5].route-type=CROSS_BORDER_CORRESPONDENT
payment-routing.corridors[5].enabled=true

# Corridor 7: India -> Nepal (Same Currency)
payment-routing.corridors[6].debtor-country-code=IN
payment-routing.corridors[6].creditor-country-code=NP
payment-routing.corridors[6].settlement-currency=INR
payment-routing.corridors[6].route-type=CROSS_BORDER_CORRESPONDENT
payment-routing.corridors[6].enabled=true

# ==========================================
# FINANCIAL CALCULATION CONFIGURATION
# ==========================================

# FX rates:
# Source currency units per 1 destination currency unit.
# Example: 84.70 INR = 1 USD.

payment-financial.fx-rates.INR_USD=84.70
payment-financial.fx-rates.INR_GBP=110.00
payment-financial.fx-rates.INR_SGD=63.00
payment-financial.fx-rates.USD_GBP=0.79
payment-financial.fx-rates.EUR_USD=1.08

# ==========================================
# FIXED CROSS-BORDER TRANSFER FEES
# Fees are charged separately in source currency.
# ==========================================

payment-financial.cross-border-fees.INR_INR=250.00
payment-financial.cross-border-fees.INR_USD=250.00
payment-financial.cross-border-fees.INR_GBP=300.00
payment-financial.cross-border-fees.INR_SGD=200.00
payment-financial.cross-border-fees.USD_GBP=5.00
payment-financial.cross-border-fees.EUR_USD=5.00

# ==========================================
# PAYMENT NETWORK SIMULATION
# ==========================================

payment-network.simulation.domestic-outcome=SIMULATED_ACKNOWLEDGED
payment-network.simulation.cross-border-outcome=SIMULATED_ACKNOWLEDGED

# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.main.allow-bean-definition-overriding=true
